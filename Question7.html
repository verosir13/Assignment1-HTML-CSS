<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="submit_form.php" method="post">
        <caption><h3>Student Registration Form</h3></caption><hr>
        <label for="name"> Full Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="course">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <caption><h3>Gender</h3></caption>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male"> Male</label><br>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female"> Female</label><br><br>

        <caption><h3>Preferred Programming Language</h3></caption>
        <input type="checkbox" id="language" name="language" required>
        <label for="python">Python</label><br><br>
        <input type="checkbox" id="language" name="language" required>
        <label for="language">JavaScript</label><br><br>
        <input type="checkbox" id="language" name="language" required>
        <label for="language">Java</label><br><br>
        <input type="checkbox" id="language" name="language" required>
        <label for="language">C++</label><br><br>

        <label for="course"> Select a Course:</label>
        <select id="course" name="course" required>
            <option value="computer_science">Computer Science</option>
            <option value="information_technology">Information Technology</option>
            <option value="software_engineering">Software Engineering</option>
            <option value="data_science">Data Science</option>
        </select><br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

       
    </form>
</body>
</html>
