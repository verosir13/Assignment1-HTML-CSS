<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors Example</title>
    <link rel="stylesheet" href="12.css">
</head>
<body><div id="main-heading">
        <h1>Main Heading</h1>
    </div>
    <h2>Element Selector</h2>
    <p>This is the first paragraph.</p>

    <h2>Class Selector</h2>

    <div class="content-box">
        <h3>Content Box One</h3>
        <p>This paragraph is the first.</p>
    </div>

    <div class="content-box">
        <h3>Content Box Two</h3>
        <p>This paragraph is  the second.</p>
    </div>
<div class="content-box">
<h2>Content Box Three</h2>
    <p>This is paragraph the third.</p>

</div>
    
</body>
</html>
